<div class="hint">Hover or tap the logo</div>

<script>
/* Ultrasound-scan logo: the dot is the probe. It tilts, the logo goes out of focus,
   and a scan cone sweeps left → right revealing the letters sharp inside the beam. */
const APEX = { x: 16.44, y: 3.4 };
const R = 40;          // cone length (viewBox units)
const DUR = 3.3;       // seconds

const $ = (id) => document.getElementById(id);
const blurAmt = $("blurAmt"), base = $("base"), beam = $("beam"), conePath = $("conePath"), probe = $("probe");

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;

// The beam starts from the whole bottom edge of the dot (so with no spread it reads as the "i" stem)
const DOT_L = 14.79, DOT_R = 18.09;
function sector(center, half) {
  const a1 = ((center - half) * Math.PI) / 180, a2 = ((center + half) * Math.PI) / 180;
  // angle 0 = straight down; positive = to the right
  const L = (a) => `${DOT_L + R * Math.sin(a)} ${APEX.y + R * Math.cos(a)}`;
  const Rr = (a) => `${DOT_R + R * Math.sin(a)} ${APEX.y + R * Math.cos(a)}`;
  return `M${DOT_L} ${APEX.y} L${L(a1)} L${Rr(a2)} L${DOT_R} ${APEX.y} Z`;
}

function renderAt(t) {
  // probe wiggle: tilt right, settle, then tilt again on the way out
  // the dot turns 90° in place on the way in, and back -90° on the way out
  const spin = 90 * seg(t, 0.0, 0.45) - 90 * seg(t, 2.65, 3.15);
  probe.setAttribute("transform", `rotate(${spin} 16.44 1.69)`);

  // focus: out while scanning, back in at the end
  const focus = seg(t, 0.55, 0.95) * (1 - seg(t, 2.55, 3.1));
  blurAmt.setAttribute("stdDeviation", (1.15 * focus).toFixed(3));
  base.style.opacity = (1 - 0.5 * focus).toFixed(3);

  // cone: appears as a thin beam, opens to the left, sweeps right, closes
  const show = (t > 0.3 ? 1 : 0) * (1 - seg(t, 2.6, 2.85));
  // the stem grows down out of the dot before anything moves
  document.getElementById("bandRect").setAttribute("height", (17.3 * seg(t, 0.3, 0.75)).toFixed(3));
  const half = lerp(0, 30, seg(t, 0.8, 1.2)) * (1 - seg(t, 2.25, 2.6));
  let center = lerp(0, -24, seg(t, 0.8, 1.2));
  center = lerp(center, 24, seg(t, 1.2, 2.25));
  center = lerp(center, 0, seg(t, 2.25, 2.6));
  const d = show > 0.001 ? sector(center, half) : "";
  conePath.setAttribute("d", d || "M0 0Z");
  beam.setAttribute("d", d);
  beam.style.opacity = show.toFixed(3);
}
window.renderAt = renderAt;
window.DURATION = DUR;
renderAt(0);

let start = null, running = false;
function play() {
  if (running) return;
  running = true;
  start = performance.now();
  const tick = (now) => {
    const t = (now - start) / 1000;
    renderAt(Math.min(t, DUR));
    if (t < DUR) requestAnimationFrame(tick);
    else { running = false; renderAt(0); }
  };
  requestAnimationFrame(tick);
}
const stage = $("stage");
stage.addEventListener("mouseenter", play);
stage.addEventListener("click", play);
if (!location.search.includes("capture")) setTimeout(play, 600);
else document.body.classList.add("capture");
</script>
<script>setInterval(() => { if (!document.hidden) play(); }, 5200);</script>
